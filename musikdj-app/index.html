<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MusikDJ Artist</title>
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MusikDJ">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
/* MusikDJ Artist. Layout: one phone-width column. A slim top bar, a scrolling view, a bottom tab bar.
   The next gig is the single filled "night" card; everything else is quiet grouped rows. */
:root{
  --bg:#141414; --surface:#1E1E1E; --surface-2:#282828; --ink:#F2F2F2; --muted:#A3A3A3; --line:#323232;
  --accent:#2A938E; --accent-ink:#4CC2BC; --on-accent:#FFFFFF; --accent-soft:#16302F;
  --ok:#56D6A0; --ok-soft:#12382B; --warn:#FFC061; --warn-soft:#3D2C0C; --bad:#FF8A80; --bad-soft:#44201D;
  /* MusikDJ blue from the bureau's own icon carries the "next gig" card */
  --night:#2C4681; --on-night:#FFFFFF; --on-night-muted:#C5D0EA; --night-line:#4A64A0; --beam:#5FD3CD;
  --bar:#111111; --on-bar:#FFFFFF; --on-bar-muted:#BDBDBD; --bar-line:#363636; --bar-accent:#4CC2BC;
  --font-display:'Oswald','Arial Narrow',Impact,sans-serif;
  --font-body:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
  --bg:#F0F0F0; --surface:#FFFFFF; --surface-2:#F5F5F5; --ink:#1A1A1A; --muted:#5C5C5C; --line:#DBDBDB;
  --accent:#2A938E; --accent-ink:#1E7A75; --on-accent:#FFFFFF; --accent-soft:#E0F2F1;
  --ok:#0F7A52; --ok-soft:#DDF3E9; --warn:#8F5400; --warn-soft:#FFEFCF; --bad:#B3261E; --bad-soft:#FBE4E2;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F0F0F0; --surface:#FFFFFF; --surface-2:#F5F5F5; --ink:#1A1A1A; --muted:#5C5C5C; --line:#DBDBDB;
  --accent:#2A938E; --accent-ink:#1E7A75; --on-accent:#FFFFFF; --accent-soft:#E0F2F1;
  --ok:#0F7A52; --ok-soft:#DDF3E9; --warn:#8F5400; --warn-soft:#FFEFCF; --bad:#B3261E; --bad-soft:#FBE4E2;
  color-scheme:light;
}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer}
a{color:var(--accent-ink)}
ul,ol,dl,dd,h1,h2,h3,p{margin:0;padding:0}
ul,ol{list-style:none}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:500px){.app{border-inline:1px solid var(--line)}}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{display:flex;align-items:center;gap:12px;min-height:52px;padding-block:6px}
.brand{font-family:var(--font-display);font-weight:750;font-size:19px;letter-spacing:-0.01em}
.who{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--surface)}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--accent);min-height:40px;padding-right:10px}
.back svg{width:20px;height:20px}

/* view */
.view{flex:1;min-height:0;overflow-y:auto;padding-block:6px 32px;display:flex;flex-direction:column;gap:22px}
.view > *{flex:none}
.lede{display:flex;flex-direction:column;gap:2px}
.lede small{font-size:13px;color:var(--muted);font-weight:500}
h1{font-family:var(--font-display);font-weight:750;font-size:27px;line-height:1.12;letter-spacing:-0.015em;text-wrap:balance}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:center;gap:8px}
.sec-head h2{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-0.005em}
.sec-head .count{font-size:12px;font-weight:700;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 8px}
.sec-head .aside{margin-left:auto;font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}

/* pills + chips */
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill-ok{background:var(--ok-soft);color:var(--ok)}
.pill-warn{background:var(--warn-soft);color:var(--warn)}
.pill-bad{background:var(--bad-soft);color:var(--bad)}
.pill-quiet{background:var(--surface-2);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted);background:var(--surface)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;text-align:center;flex:1}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn-bad{background:var(--bad-soft);color:var(--bad)}
.btn-small{min-height:36px;padding:0 12px;font-size:13px;flex:none;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* hero: the next gig */
.hero{background:var(--night);color:var(--on-night);border-radius:24px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:16px}
.hero-head{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--on-night-muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero h2{font-family:var(--font-display);font-weight:750;font-size:30px;line-height:1.05;letter-spacing:-0.02em}
.hero-where{color:var(--on-night-muted);font-size:14px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid var(--night-line);padding-top:14px}
.hero-stats dt{font-size:12px;color:var(--on-night-muted);font-weight:500}
.hero-stats dd{font-family:var(--font-display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn-night{background:var(--on-night);color:var(--night)}
.btn-night-ghost{border:1px solid var(--night-line);color:var(--on-night)}
.hero :focus-visible{outline-color:var(--on-night)}

/* the night as a track: setup, then playing time */
.track{display:flex;flex-direction:column;gap:7px}
.track-bar,.track-labels{display:grid;column-gap:4px}
.seg{height:10px;border-radius:5px}
.seg-setup{background:repeating-linear-gradient(135deg,var(--tr-soft) 0 4px,transparent 4px 8px);border:1px solid var(--tr-soft)}
.seg-play{background:var(--tr-fill)}
.track-labels{font-size:12px;color:var(--tr-muted);line-height:1.25}
.track-labels b{display:block;font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--tr-ink);font-variant-numeric:tabular-nums}
.tl-play{display:flex;justify-content:space-between;gap:8px}
.tl-end{text-align:right}
.track{--tr-fill:var(--accent);--tr-soft:var(--muted);--tr-ink:var(--ink);--tr-muted:var(--muted)}
.hero .track{--tr-fill:var(--beam);--tr-soft:var(--on-night-muted);--tr-ink:var(--on-night);--tr-muted:var(--on-night-muted)}

/* grouped rows */
.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.group > li + li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 12px 12px 14px;min-height:64px}
.datebox{flex:none;width:46px;display:flex;flex-direction:column;align-items:center;line-height:1.05;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.datebox .db-d{font-family:var(--font-display);font-size:22px;font-weight:750;color:var(--ink);letter-spacing:-0.02em;font-variant-numeric:tabular-nums;padding-block:1px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-title{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row-meta{font-size:13px;font-variant-numeric:tabular-nums}
.chev{flex:none;color:var(--muted);display:flex}
.chev svg{width:18px;height:18px}
.offer-actions{display:flex;gap:10px;padding:0 14px 14px;flex-wrap:wrap;align-items:center}
.offer-actions p{flex-basis:100%;font-size:13px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:18px 16px;color:var(--muted);font-size:14px}

/* job detail */
.job-head{display:flex;flex-direction:column;gap:8px}
.job-head p{color:var(--muted)}
.status-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.banner strong{color:var(--warn)}
.banner li{font-size:14px;padding-left:14px;position:relative}
.banner li::before{content:"";position:absolute;left:2px;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.kv{display:flex;flex-direction:column;gap:12px}
.kv > div{display:flex;flex-direction:column;gap:1px}
.kv dt{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.kv dd{overflow-wrap:anywhere}
.big{font-family:var(--font-display);font-size:26px;font-weight:750;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.person{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.person-main{flex:1;min-width:0}
.person-main small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.person-main a{font-variant-numeric:tabular-nums;font-weight:600;text-decoration:none}
.divide > * + *{border-top:1px solid var(--line);padding-top:12px}
.check{display:flex;align-items:center;gap:12px;min-height:40px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.plain-list li{padding-left:14px;position:relative}
.plain-list li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:600;text-align:center;line-height:1}
.stepper output{min-width:92px;text-align:center;font-family:var(--font-display);font-weight:700;font-size:19px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.split small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.split b{font-family:var(--font-display);font-size:19px;font-variant-numeric:tabular-nums}
.history li{display:flex;gap:12px;font-size:14px}
.history time{flex:none;width:56px;color:var(--muted);font-variant-numeric:tabular-nums}
.history span{min-width:0;overflow-wrap:anywhere}

/* calendar */
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav h1{flex:1;text-transform:capitalize}
.cal-nav button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.cal-nav svg{width:18px;height:18px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 8px 8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-wd{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-bottom:6px}
.cal-day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;position:relative}
.cal-day.is-today .cal-n{color:var(--accent-ink);font-weight:800}
.cal-day.is-away{color:var(--muted);background:repeating-linear-gradient(135deg,var(--surface-2) 0 5px,transparent 5px 10px)}
.cal-day.is-away .cal-n{text-decoration:line-through}
.cal-day[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.cal-day[aria-pressed="true"] .cal-n{color:var(--on-accent);text-decoration:none}
.cal-marks{display:flex;gap:3px;height:6px}
.m{width:6px;height:6px;border-radius:50%;display:block}
.m-job{background:var(--accent-ink)}
.m-offer{border:1.5px solid var(--warn)}
.cal-day[aria-pressed="true"] .m-job{background:var(--on-accent)}
.cal-day[aria-pressed="true"] .m-offer{border-color:var(--on-accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:8px 6px 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:14px;height:10px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px);border:1px solid var(--line)}

/* updates */
.seg-ctl{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg-ctl button{flex:1;text-align:center;min-height:36px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.upd{display:flex;gap:12px;width:100%;padding:13px 14px;align-items:flex-start}
.upd-dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px;background:transparent}
.upd.is-unread .upd-dot{background:var(--accent)}
.upd-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.upd-main b{font-weight:700}
.upd:not(.is-unread) .upd-main b{font-weight:600}
.upd-main span{font-size:14px;overflow-wrap:anywhere}
.upd-main small{font-size:12px;color:var(--muted)}
.upd time{flex:none;font-size:12px;color:var(--muted);white-space:nowrap;margin-top:2px}

/* money */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 10px;min-width:0}
.tile small{display:block;font-size:12px;color:var(--muted);font-weight:600;line-height:1.25;min-height:2.5em}
.tile b{font-family:var(--font-display);font-size:18px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;white-space:nowrap}
.pay{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px}
.pay-main{flex:1;min-width:0;display:flex;flex-direction:column}
.pay-main small{font-size:13px;color:var(--muted)}
.pay-amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pay-amt small{font-weight:600;font-size:12px;color:var(--ok)}

/* bottom */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-block:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;text-align:center;position:relative}
.tab .ico{width:52px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative}
.tab svg{width:21px;height:21px}
.tab[aria-current="page"]{color:var(--accent-ink)}
.tab[aria-current="page"] .ico{background:var(--accent-soft)}
.badge{position:absolute;top:-3px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:var(--surface);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.actionbar{background:var(--surface);border-top:1px solid var(--line);padding-block:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.actionbar p{flex-basis:100%;font-size:13px;color:var(--muted)}

.file-ico{flex:none;width:42px;height:42px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.file-ico svg{width:21px;height:21px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{font:inherit;font-size:16px;font-weight:400;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field textarea{resize:vertical;min-height:84px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px;text-align:center;z-index:5}
.foot{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.foot button{color:var(--accent-ink);font-weight:600;min-height:32px}
@media (prefers-reduced-motion:no-preference){
  .btn,.tab .ico,.cal-day{transition:background-color .15s ease}
  .toast{animation:rise .2s ease-out}
  @keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
}

/* MusikDJ brand layer: square-ish corners, condensed uppercase display type, a black top bar for the outlined logo */
html{background:var(--bar)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.app{padding-bottom:0}
.top{background:var(--bar);color:var(--on-bar);padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:8px;min-height:56px}
.top .back{color:var(--bar-accent)}
.logo{height:22px;width:auto;display:block}
.logo-tag{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--bar-accent);border-left:1px solid var(--bar-line);padding-left:10px;line-height:22px}
.who{background:transparent;border-color:var(--bar-line);color:var(--on-bar-muted)}
.tabs{padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
.actionbar{padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
h1,.sec-head h2,.hero h2,.cal-nav h1{font-family:var(--font-display);text-transform:uppercase;font-weight:500;letter-spacing:.02em}
h1{font-size:28px;line-height:1.12}
.sec-head h2{font-size:17px;letter-spacing:.06em}
.hero h2{font-size:32px;font-weight:600;line-height:1.05}
.eyebrow{font-family:var(--font-display);font-weight:500;letter-spacing:.12em}
.datebox .db-d,.big,.hero-stats dd,.tile b,.track-labels b,.split b,.stepper output{font-family:var(--font-display);font-weight:500;letter-spacing:0}
.btn{border-radius:4px;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.05em;font-weight:500;font-size:16px}
.btn-small{font-size:13px;border-radius:4px}
.stepper button,.cal-nav button{border-radius:4px}
.group,.panel,.empty,.cal,.tile,.banner{border-radius:10px}
.hero{border-radius:14px}
.seg-ctl{border-radius:6px}.seg-ctl button{border-radius:4px}
.lede small{text-transform:uppercase;letter-spacing:.08em;font-size:12px}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top gutter" id="top"></header>
  <main class="view gutter" id="view"></main>
  <div id="bottom"></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script>

/* ---------- dates and formatting ---------- */
const T=(y,m,d,h,mi)=>new Date(y,m-1,d,h||0,mi||0);
const WD=['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
const WD3=['søn','man','tir','ons','tor','fre','lør'];
const MO=['januar','februar','marts','april','maj','juni','juli','august','september','oktober','november','december'];
const MO3=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
const p2=n=>String(n).padStart(2,'0');
const time=d=>p2(d.getHours())+'.'+p2(d.getMinutes());
const key=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const longDate=d=>WD[d.getDay()]+' '+d.getDate()+'. '+MO[d.getMonth()];
const shortDate=d=>WD3[d.getDay()]+' '+d.getDate()+'. '+MO3[d.getMonth()];
const kr=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' kr';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const dayDiff=(a,b)=>Math.round((dayStart(a)-dayStart(b))/86400000);

/* The demo data sits around late November 2026. Outside that window "today" is pinned so the app still looks alive. */
let NOW=new Date();
if(NOW<T(2026,11,16,18)||NOW>T(2026,11,27,12)) NOW=T(2026,11,17,10);

function relTime(d){
  const n=dayDiff(NOW,d);
  if(n<=0) return 'i dag '+time(d);
  if(n===1) return 'i går';
  if(n<7) return WD[d.getDay()];
  return d.getDate()+'. '+MO3[d.getMonth()];
}
function hoursLabel(h){
  const whole=Math.floor(h), half=h%1!==0;
  return (whole?whole:'')+(half?'½':'')+(h<=1?' time':' timer');
}

function track(j){
  const a=Math.max(1,(j.start-j.setupAt)/60000), b=(j.end-j.start)/60000;
  const cols='grid-template-columns:minmax(84px,'+a+'fr) '+b+'fr';
  return '<div class="track" role="img" aria-label="Ankomst '+time(j.setupAt)+', spillestart '+time(j.start)+', slut '+time(j.end)+'">'+
    '<div class="track-bar" style="'+cols+'"><span class="seg seg-setup"></span><span class="seg seg-play"></span></div>'+
    '<div class="track-labels" style="'+cols+'"><span><b>'+time(j.setupAt)+'</b>Ankomst</span>'+
    '<span class="tl-play"><span><b>'+time(j.start)+'</b>Spillestart</span><span class="tl-end"><b>'+time(j.end)+'</b>Slut</span></span></div></div>';
}
function rowPills(j){
  const s=statusOf(j);let out='';
  if(s==='confirmed'&&unreadChanges(j).length) out+='<span class="pill pill-warn">Ændret</span>';
  if(s==='offer'&&route.name!=='home') out+='<span class="pill pill-warn">Venter på svar</span>';
  return out;
}

  if(s==='done'){
    const rep=state.reports[j.id]||j.report;
    h+='<section class="sec"><div class="sec-head"><h2>Afrapportering</h2>'+(rep?'<span class="pill pill-ok">Sendt</span>':'<span class="pill pill-warn">Mangler</span>')+'</div><div class="panel">';
    if(rep){
      h+='<dl class="kv"><div><dt>Musikken stoppede</dt><dd class="num">'+esc(rep.end)+'</dd></div><div><dt>Sådan gik det</dt><dd>'+esc(rep.text)+'</dd></div></dl>';
    }else{
      h+='<p class="hint">Fortæl bureauet, hvordan aftenen gik. Det tager et minut.</p>'+
        '<label class="field" for="rep-end"><span>Hvornår stoppede musikken?</span><input type="time" id="rep-end" value="'+p2(j.end.getHours())+':'+p2(j.end.getMinutes())+'"></label>'+
        '<div class="field"><span>Hvordan var stemningen?</span><div class="seg-ctl" role="group" aria-label="Stemning">'+
        ['Fed','God','Okay','Svær'].map(m=>'<button type="button" id="mood-'+m+'" data-act="mood" data-m="'+m+'" aria-pressed="'+(ui.mood===m)+'">'+m+'</button>').join('')+'</div></div>'+
        '<label class="field" for="rep-text"><span>Noget bureauet skal vide?</span><textarea id="rep-text" rows="3" placeholder="Fx forlængelse, problemer med udstyr eller ros fra kunden"></textarea></label>'+
        '<div class="btn-row"><button class="btn btn-primary" data-act="report" data-id="'+j.id+'">Send afrapportering</button></div>';
    }
    h+='</div></section>';
    if(j.feedback) h+='<section class="sec"><div class="sec-head"><h2>Feedback fra bureauet</h2></div><div class="panel"><p>'+esc(j.feedback)+'</p></div></section>';
  }

  h+='<section class="sec"><div class="sec-head"><h2>Din projektleder hos MusikDJ</h2></div><div class="panel">'+personRow('MusikDJ',j.pm.name,j.pm.phone)+'</div></section>';

  const hist=UPDATES.filter(u=>u.job===j.id).sort((a,b)=>b.at-a.at);
  if(hist.length){
    h+='<section class="sec"><div class="sec-head"><h2>Historik</h2></div><div class="panel"><ul class="history kv">'+
      hist.map(u=>'<li><time>'+u.at.getDate()+'. '+MO3[u.at.getMonth()]+'</time><span>'+updateLine(u)+'</span></li>').join('')+'</ul></div></section>';
  }
  return h;
}

function calView(){
  const modeCtl='<div class="seg-ctl"><button id="cm-month" data-act="calmode" data-m="month" aria-pressed="'+(ui.calMode==='month')+'">Måned</button>'+
    '<button id="cm-list" data-act="calmode" data-m="list" aria-pressed="'+(ui.calMode==='list')+'">Liste</button></div>';
  if(ui.calMode==='list'){
    const items=JOBS.filter(j=>['confirmed','offer'].includes(statusOf(j))&&j.end>NOW).sort((a,b)=>a.start-b.start);
    let h='<div class="cal-nav"><h1>Kalender</h1></div>'+modeCtl;
    if(!items.length) return h+'<p class="empty">Ingen kommende jobs.</p>';
    let cur='';
    items.forEach(j=>{
      const mk=MO[j.start.getMonth()]+' '+j.start.getFullYear();
      if(mk!==cur){if(cur) h+='</ul></section>';cur=mk;h+='<section class="sec"><div class="sec-head"><h2>'+cap(mk)+'</h2></div><ul class="group">';}
      h+='<li>'+jobRow(j)+'</li>';
    });
    return h+'</ul></section>';
  }
  const y=ui.calY,m=ui.calM,first=new Date(y,m,1),offset=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),todayK=key(NOW);
  const on=k=>JOBS.filter(j=>key(j.start)===k&&statusOf(j)!=='declined');
  let cells=['man','tir','ons','tor','fre','lør','søn'].map(w=>'<span class="cal-wd">'+w+'</span>').join('');
  for(let i=0;i<offset;i++) cells+='<span></span>';
  for(let d=1;d<=dim;d++){
    const k=key(new Date(y,m,d)),js=on(k);
    const hasJob=js.some(j=>statusOf(j)!=='offer'),hasOffer=js.some(j=>statusOf(j)==='offer'),away=state.away.includes(k);
    cells+='<button class="cal-day'+(k===todayK?' is-today':'')+(away?' is-away':'')+'" id="d-'+k+'" data-act="day" data-k="'+k+'" aria-pressed="'+(k===ui.sel)+'" '+
      'aria-label="'+d+'. '+MO[m]+(hasJob?', job':'')+(hasOffer?', venter på svar':'')+(away?', ikke ledig':'')+'">'+
      '<span class="cal-n">'+d+'</span><span class="cal-marks">'+(hasJob?'<i class="m m-job"></i>':'')+(hasOffer?'<i class="m m-offer"></i>':'')+'</span></button>';
  }
  let h='<div class="cal-nav"><h1>'+MO[m]+' '+y+'</h1><button id="cal-prev" data-act="cal-move" data-d="-1" aria-label="Forrige måned">'+icon('back')+'</button>'+
    '<button id="cal-next" data-act="cal-move" data-d="1" aria-label="Næste måned">'+icon('chev')+'</button></div>';
  h+=modeCtl+'<div class="cal"><div class="cal-grid">'+cells+'</div>'+
    '<div class="legend"><span><i class="m m-job"></i>Job</span><span><i class="m m-offer"></i>Venter på svar</span><span><i class="sw"></i>Ikke ledig</span></div></div>';

  const parts=ui.sel.split('-').map(Number),sd=new Date(parts[0],parts[1]-1,parts[2]),js=on(ui.sel),away=state.away.includes(ui.sel);
  h+='<section class="sec"><div class="sec-head"><h2>'+cap(longDate(sd))+'</h2></div>';
  if(js.length) h+='<ul class="group">'+js.map(j=>'<li>'+jobRow(j)+'</li>').join('')+'</ul>';
  else{
    h+='<p class="empty">'+(away?'Du er markeret som ikke ledig denne dag.':'Ingen jobs denne dag.')+'</p>';
    if(dayDiff(sd,NOW)>=0){
      h+='<div class="btn-row"><button class="btn btn-ghost" id="away-toggle" data-act="away" data-k="'+ui.sel+'">'+(away?'Markér som ledig igen':'Markér som ikke ledig')+'</button></div>'+
        '<p class="hint">Bureauet kan se dine ikke-ledige dage, når de fordeler jobs.</p>';
    }
  }
  h+='</section>';
  return h;
}

function updView(){
  const list=UPDATES.filter(u=>ui.filter==='all'||!isSeen(u)).sort((a,b)=>b.at-a.at);
  let h='<div class="lede"><h1>Opdateringer</h1></div>';
  h+='<div class="seg-ctl"><button id="f-all" data-act="filter" data-f="all" aria-pressed="'+(ui.filter==='all')+'">Alle</button>'+
    '<button id="f-unread" data-act="filter" data-f="unread" aria-pressed="'+(ui.filter==='unread')+'">Ulæste ('+unreadCount()+')</button></div>';
  if(!list.length) return h+'<p class="empty">Du er helt opdateret.</p>';
  h+='<ul class="group">'+list.map(u=>{
    const j=jobById(u.job),s=statusOf(j);
    let title,body;
    const jobLabel=esc(j.event)+', '+shortDate(j.start);
    if(u.kind==='offer'){
      title='Nyt job: '+esc(j.event);
      body=shortDate(j.start)+' · '+time(j.start)+'–'+time(j.end)+' · '+kr(j.fee);
      if(s==='confirmed') body+=' · Du har accepteret';
      if(s==='declined') body+=' · Du har afvist';
    }else if(u.kind==='change'){
      title=esc(u.label)+' ændret';
      body=(u.from?esc(u.from)+' → ':'')+esc(u.to);
    }else if(u.kind==='feedback'){title='Feedback fra bureauet';body=esc(j.feedback);
    }else{title='Job delt med dig';body=esc(j.customer);}
    return '<li><button class="upd'+(isSeen(u)?'':' is-unread')+'" data-act="open" data-id="'+j.id+'">'+
      '<span class="upd-dot"></span><span class="upd-main"><b>'+title+'</b><span>'+body+'</span>'+(u.kind==='offer'?'':'<small>'+jobLabel+'</small>')+'</span>'+
      '<time>'+relTime(u.at)+'</time></button></li>';
  }).join('')+'</ul>';
  return h;
}

function moneyView(){
  const done=JOBS.filter(j=>statusOf(j)==='done').sort((a,b)=>b.start-a.start),up=upcoming();
  const sum=(a,f)=>a.reduce((t,j)=>t+f(j),0);
  const paid=sum(done.filter(j=>j.payout==='paid'),j=>j.fee),pend=sum(done.filter(j=>j.payout!=='paid'),j=>j.fee+extPay(j)),coming=sum(up,j=>j.fee+extPay(j));
  const payRow=(j,right)=>'<li><button class="pay" data-act="open" data-id="'+j.id+'"><span class="pay-main"><b>'+esc(j.event)+'</b><small>'+shortDate(j.start)+' · '+esc(j.customer)+'</small></span>'+
    '<span class="pay-amt">'+kr(j.fee+extPay(j))+right+'</span></button></li>';
  let h='<div class="lede"><small>Efterår 2026</small><h1>Økonomi</h1></div>';
  h+='<div class="tiles"><div class="tile"><small>Udbetalt</small><b>'+kr(paid)+'</b></div><div class="tile"><small>Afventer udbetaling</small><b>'+kr(pend)+'</b></div><div class="tile"><small>Kommende jobs</small><b>'+kr(coming)+'</b></div></div>';
  h+='<section class="sec"><div class="sec-head"><h2>Kommende honorarer</h2></div>'+(up.length?'<ul class="group">'+up.map(j=>payRow(j,extPay(j)?'<small>inkl. forlængelse</small>':'')).join('')+'</ul>':'<p class="empty">Ingen bekræftede jobs.</p>')+'</section>';
  h+='<section class="sec"><div class="sec-head"><h2>Afholdte jobs</h2></div><ul class="group">'+
    done.map(j=>payRow(j,j.payout==='paid'?'<span class="pill pill-ok">Udbetalt</span>':'<span class="pill pill-warn">Afventer</span>')).join('')+'</ul>'+
    '<p class="hint">Honoraret udbetales, når kunden har betalt fakturaen fra kontoret.</p></section>';
  return h;
}

/* ---------- chrome ---------- */
function topbar(){
  if(route.name==='job') return '<button class="back" data-act="back">'+icon('back')+'Tilbage</button>';
  return '<img class="logo" src="'+LOGO+'" alt="MusikDJ"><span class="logo-tag">Artist</span><span class="who">DJ Hawani</span>';
}
function bottom(){
  if(route.name==='job'){
    const j=jobById(route.id),s=j?statusOf(j):'';
    if(s==='offer') return answerButtons(j,'actionbar gutter');
    if(s==='declined') return '<div class="actionbar gutter"><button class="btn btn-ghost" data-act="undecline" data-id="'+j.id+'">Fortryd afvisning</button></div>';
    return '';
  }
  const n=unreadCount();
  const tab=(name,label,ic,badge)=>'<button class="tab" id="tab-'+name+'" data-act="tab" data-tab="'+name+'"'+(route.name===name?' aria-current="page"':'')+'>'+
    '<span class="ico">'+icon(ic)+(badge?'<span class="badge">'+badge+'</span>':'')+'</span>'+label+'</button>';
  return '<nav class="tabs gutter" aria-label="Sektioner">'+tab('home','Hjem','home')+tab('cal','Kalender','cal')+tab('upd','Opdateringer','bell',n)+tab('money','Økonomi','wallet')+'</nav>';
}
const VIEWS={home:homeView,cal:calView,upd:updView,money:moneyView,job:jobView};
const $=id=>document.getElementById(id);
function render(keepScroll){
  const view=$('view'),st=view.scrollTop,fid=document.activeElement&&document.activeElement.id;
  $('top').innerHTML=topbar();
  view.innerHTML=VIEWS[route.name]();
  $('bottom').innerHTML=bottom();
  view.scrollTop=keepScroll?st:0;
  if(keepScroll&&fid){const el=$(fid);if(el) el.focus({preventScroll:true});}
}

const HASH={home:'hjem',cal:'kalender',upd:'opdateringer',money:'okonomi'};
function hashFor(r){return r.name==='job'?'job-'+r.id:HASH[r.name];}
function routeFromHash(){
  const h=(location.hash||'').replace('#','');
  if(h.indexOf('job-')===0&&jobById(h.slice(4))) return {name:'job',id:h.slice(4)};
  const name=Object.keys(HASH).find(k=>HASH[k]===h);
  return {name:name||'home'};
}
function go(r){
  if(r.name!=='job') lastTab=r.name;
  if(r.name==='job'){
    const j=jobById(r.id);
    if(j) markSeen(UPDATES.filter(u=>u.job===j.id&&u.kind!=='change'));
    ui.extHours=1;ui.extOk=false;ui.mood=null;
  }
  ui.declining=null;
  route=r;
  render(false);
  try{if(location.hash.replace('#','')!==hashFor(r)) location.hash=hashFor(r);}catch(e){}
}
window.addEventListener('hashchange',()=>{
  const r=routeFromHash();
  if(hashFor(r)!==hashFor(route)) go(r);
});

let toastTimer;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},2800);
}

/* ---------- actions ---------- */
$('app').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el) return;
  const act=el.dataset.act,id=el.dataset.id;
  if(act==='tab') return go({name:el.dataset.tab});
  if(act==='open') return go({name:'job',id:id});
  if(act==='back') return go({name:lastTab});
  if(act==='accept'){
    state.status[id]='confirmed';markSeen(UPDATES.filter(u=>u.job===id&&u.kind==='offer'));
    ui.declining=null;render(true);return toast('Job accepteret. Det står nu i din kalender.');
  }
  if(act==='decline-ask'){ui.declining=id;return render(true);}
  if(act==='decline-cancel'){ui.declining=null;return render(true);}
  if(act==='decline'){
    state.status[id]='declined';markSeen(UPDATES.filter(u=>u.job===id&&u.kind==='offer'));
    ui.declining=null;
    if(route.name==='job') go({name:lastTab}); else render(true);
    return toast('Job afvist.');
  }
  if(act==='undecline'){delete state.status[id];save();render(true);return toast('Afvisningen er fortrudt.');}
  if(act==='ack'){markSeen(unreadChanges(jobById(id)));render(true);return toast('Markeret som læst. Bureauet kan se, at du er opdateret.');}
  if(act==='copy'){
    const text=el.dataset.text;
    const fail=()=>toast('Kunne ikke kopiere. Markér teksten og kopiér selv.');
    try{navigator.clipboard.writeText(text).then(()=>toast('Kopieret: '+text),fail);}catch(err){fail();}
    return;
  }
  if(act==='ext-step'){ui.extHours=Math.min(4,Math.max(0.5,ui.extHours+Number(el.dataset.d)));return render(true);}
  if(act==='ext-save'){
    if(!ui.extOk) return;
    state.ext[id]=ui.extHours;save();render(true);return toast('Forlængelse registreret. Kontoret fakturerer kunden.');
  }
  if(act==='ext-undo'){delete state.ext[id];save();ui.extOk=false;render(true);return toast('Registreringen er fjernet.');}
  if(act==='day'){ui.sel=el.dataset.k;return render(true);}
  if(act==='cal-move'){
    const d=new Date(ui.calY,ui.calM+Number(el.dataset.d),1);ui.calY=d.getFullYear();ui.calM=d.getMonth();
    ui.sel=(d.getFullYear()===NOW.getFullYear()&&d.getMonth()===NOW.getMonth())?key(NOW):key(d);
    return render(true);
  }
  if(act==='away'){
    const k=el.dataset.k,i=state.away.indexOf(k);
    if(i>=0) state.away.splice(i,1); else state.away.push(k);
    save();render(true);return toast(i>=0?'Du er ledig igen denne dag.':'Markeret som ikke ledig.');
  }
  if(act==='filter'){ui.filter=el.dataset.f;return render(true);}
  if(act==='calmode'){ui.calMode=el.dataset.m;return render(true);}
  if(act==='file') return toast('I den færdige app åbnes filen her.');
  if(act==='mood'){
    ui.mood=el.dataset.m;
    el.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));
    return;
  }
  if(act==='report'){
    const end=($('rep-end').value||'').replace(':','.'),txt=$('rep-text').value.trim();
    state.reports[id]={end:end||'–',text:(ui.mood?'Stemning: '+ui.mood+'. ':'')+(txt||'Ingen bemærkninger.')};
    ui.mood=null;save();render(true);
    return toast('Afrapportering sendt til bureauet.');
  }
  if(act==='reset'){state=DEFAULTS();save();render(false);return toast('Demoen er nulstillet.');}
});
$('app').addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.gear!==undefined){
    const id=el.dataset.id,i=Number(el.dataset.gear),arr=(state.packed[id]||[]).filter(x=>x!==i);
    if(el.checked) arr.push(i);
    state.packed[id]=arr;save();
    const c=$('gear-count');if(c) c.textContent=arr.length+' af '+jobById(id).gear.length+' pakket';
  }
  if(el.id==='ext-ok'){ui.extOk=el.checked;const b=$('ext-save');if(b) b.disabled=!el.checked;}
});

route=routeFromHash();
if(route.name!=='job') lastTab=route.name;
render(false);
})();
</script>
</body>
